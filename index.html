<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d1a12">
  <title>Savoie &amp; Alps — Summer 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f7f2e8;
      --forest: #243d2e;
      --forest-mid: #345c42;
      --forest-light: #4a7d5a;
      --glacier-light: #82bdd0;
      --charcoal: #181e1b;
      --warm-white: #fdf9f2;
      --tips-bg: #f4e8cc;
      --tips-border: #c8a050;
      --divider: #ddd4bc;
      --stone: #9a8a74;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--charcoal);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* ─── HEADER ─────────────────────────────────── */
    .app-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: max(env(safe-area-inset-top), 12px) 16px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      background: linear-gradient(to bottom, rgba(10,20,14,0.75) 0%, transparent 100%);
      pointer-events: none;
    }
    .header-top-row {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; pointer-events: all;
    }
    .trip-eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 9.5px; font-weight: 400;
      letter-spacing: 0.26em; text-transform: uppercase;
      color: rgba(255,255,255,0.62);
    }
    .lang-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 10px; font-weight: 500; letter-spacing: 0.06em;
      padding: 4px 11px; border-radius: 20px;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.28);
      color: rgba(255,255,255,0.88);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s;
    }
    .lang-btn:active { background: rgba(255,255,255,0.28); }
    .day-dots {
      display: flex; gap: 8px; align-items: center;
      pointer-events: all;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.32);
      transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .dot.active {
      width: 22px; border-radius: 3px;
      background: rgba(255,255,255,0.92);
    }

    /* ─── INFO BUTTON ────────────────────────────── */
    .info-btn {
      position: fixed;
      bottom: calc(max(env(safe-area-inset-bottom), 16px) + 12px);
      right: 18px; z-index: 100;
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.22);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 19px; color: white;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .info-btn:active { transform: scale(0.93); }

    /* ─── VIEWPORT / SLIDER ──────────────────────── */
    .viewport { position: fixed; inset: 0; overflow: hidden; }
    .slider {
      display: flex; height: 100%;
      will-change: transform;
      transition: transform 0.46s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .slider.no-transition { transition: none; }

    /* ─── SLIDE ──────────────────────────────────── */
    .slide {
      width: 100vw; height: 100vh; flex-shrink: 0;
      overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    /* ─── HERO (image only, no text) ─────────────── */
    .hero {
      position: relative; width: 100%; height: 52vh;
      overflow: hidden; flex-shrink: 0;
    }
    .hero-img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center;
    }
    .hero-gradient {
      position: absolute; inset: 0;
      background: linear-gradient(
        180deg,
        rgba(8,18,12,0.22) 0%,
        rgba(8,18,12,0.02) 40%,
        rgba(8,18,12,0.35) 100%
      );
    }

    /* ─── DAY HEADER (title visible without scroll) ─ */
    .day-header {
      background: var(--cream);
      border-radius: 18px 18px 0 0;
      margin-top: -18px;
      position: relative; z-index: 2;
      padding: 20px 22px 16px;
    }
    .day-label {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-size: 10.5px; font-weight: 400;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--forest-light); margin-bottom: 5px;
      opacity: 0; animation: none;
    }
    .location-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 44px; font-weight: 300; line-height: 1.0;
      color: var(--charcoal); letter-spacing: -0.01em;
      margin-bottom: 5px;
      opacity: 0; animation: none;
    }
    .location-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: 18px; font-weight: 300;
      color: var(--stone); margin-bottom: 6px;
      opacity: 0; animation: none;
    }
    .tagline {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 300;
      color: var(--stone); letter-spacing: 0.03em;
      margin-bottom: 12px;
      opacity: 0; animation: none;
    }
    .slide.active .day-label      { animation: fadeUp 0.5s ease 0.1s both; }
    .slide.active .location-title { animation: fadeUp 0.5s ease 0.22s both; }
    .slide.active .location-subtitle { animation: fadeUp 0.5s ease 0.33s both; }
    .slide.active .tagline        { animation: fadeUp 0.5s ease 0.42s both; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── COUNTRY BADGE ──────────────────────────── */
    .country-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 10.5px; font-weight: 400; letter-spacing: 0.04em;
    }
    .badge-fr { background: rgba(0,53,128,0.08); color: #003580; border: 1px solid rgba(0,53,128,0.18); }
    .badge-ch { background: rgba(200,16,46,0.08); color: #8a000f; border: 1px solid rgba(200,16,46,0.18); }

    /* ─── DAY CONTENT ────────────────────────────── */
    .day-content {
      background: var(--cream);
      padding: 8px 22px 32px;
      padding-bottom: calc(max(env(safe-area-inset-bottom), 20px) + 80px);
    }

    /* ─── SECTION ────────────────────────────────── */
    .section { margin-bottom: 28px; }
    .section-header {
      font-family: 'DM Sans', sans-serif;
      font-size: 9.5px; font-weight: 500;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--forest); margin-bottom: 12px;
      padding-bottom: 8px; border-bottom: 1px solid var(--divider);
    }

    /* ─── ACTIVITY ITEMS ─────────────────────────── */
    .activity-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 9px 0; border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .activity-item:last-child { border-bottom: none; }
    .act-icon { font-size: 16px; flex-shrink: 0; margin-top: 2px; }
    .act-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16.5px; font-weight: 600; color: var(--charcoal); line-height: 1.25;
    }
    .act-desc {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 300; color: var(--stone);
      margin-top: 2px; line-height: 1.5;
    }

    /* ─── FOOD ITEMS ─────────────────────────────── */
    .food-item {
      display: flex; gap: 12px; padding: 10px 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .food-item:last-child { border-bottom: none; }
    .food-icon { font-size: 17px; flex-shrink: 0; }
    .food-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px; font-weight: 600; color: var(--charcoal);
    }
    .food-desc {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 300; color: var(--stone);
      margin-top: 2px; line-height: 1.45;
    }

    /* ─── HOTEL CARD ─────────────────────────────── */
    .hotel-card {
      background: var(--warm-white);
      border: 1px solid var(--divider); border-radius: 14px;
      padding: 16px;
    }
    .hotel-stars { font-size: 11px; color: var(--tips-border); letter-spacing: 2px; margin-bottom: 4px; }
    .hotel-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px; font-weight: 600; color: var(--charcoal); margin-bottom: 3px;
    }
    .hotel-loc {
      font-family: 'DM Sans', sans-serif;
      font-size: 11.5px; font-weight: 300; color: var(--stone); margin-bottom: 13px;
    }
    .book-btn {
      display: block; width: 100%; padding: 13px;
      background: var(--forest); color: var(--cream);
      text-align: center; text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 10.5px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;
      border-radius: 9px; border: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: background 0.18s;
    }
    .book-btn:active { background: var(--forest-mid); }
    .book-note {
      font-family: 'DM Sans', sans-serif;
      font-size: 10.5px; font-weight: 300; color: var(--stone);
      text-align: center; margin-top: 8px; line-height: 1.5;
    }

    /* ─── TIPS BOX ───────────────────────────────── */
    .tips-box {
      background: var(--tips-bg); border: 1px solid var(--tips-border);
      border-radius: 14px; padding: 16px;
    }
    .tips-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 9.5px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase;
      color: #8a6820; margin-bottom: 12px;
    }
    .tip-row {
      display: flex; align-items: flex-start; gap: 10px;
      margin-bottom: 9px; line-height: 1.5;
    }
    .tip-row:last-child { margin-bottom: 0; }
    .tip-icon { font-size: 13px; flex-shrink: 0; margin-top: 2px; }
    .tip-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 300; color: #4a3a1a;
    }

    /* ─── EMERGENCY MODAL ────────────────────────── */
    .modal-bg {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(8,18,12,0.72);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      display: flex; align-items: flex-end;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-bg.open { opacity: 1; pointer-events: all; }
    .modal-sheet {
      background: var(--cream); border-radius: 22px 22px 0 0; width: 100%;
      padding: 22px 22px calc(max(env(safe-area-inset-bottom), 16px) + 20px);
      transform: translateY(100%);
      transition: transform 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .modal-bg.open .modal-sheet { transform: translateY(0); }
    .modal-handle {
      width: 38px; height: 4px; background: var(--divider);
      border-radius: 2px; margin: 0 auto 20px;
    }
    .modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px; font-weight: 600; color: var(--charcoal); margin-bottom: 16px;
    }
    .em-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--divider);
    }
    .em-row:last-of-type { border-bottom: none; }
    .em-label { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--charcoal); }
    .em-num { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; color: var(--forest); }
    .modal-close {
      margin-top: 16px; display: block; width: 100%; padding: 13px;
      background: var(--forest); color: var(--cream); border: none; border-radius: 10px;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      font-size: 10.5px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
    }
    .modal-close:active { background: var(--forest-mid); }

    /* ─── EDGE HINTS ─────────────────────────────── */
    .edge-hint {
      position: fixed; top: 50%; z-index: 90; transform: translateY(-50%);
      width: 32px; height: 64px; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
      color: rgba(255,255,255,0.55); font-size: 20px;
    }
    .edge-hint.left  { left: 8px; }
    .edge-hint.right { right: 8px; }
    .edge-hint.show  { opacity: 1; }
  </style>
</head>
<body>

<header class="app-header">
  <div class="header-top-row">

  /* ─── STATE ─────────────────────────────────────────────────── */
  let current = 0;
  let lang = 'en';

  /* ─── BUILD SLIDES ──────────────────────────────────────────── */
  function buildSlides() {
    const slider = document.getElementById('slider');
    slider.innerHTML = '';
    const ui = UI[lang];
    const days = DAYS[lang];

    days.forEach((day, i) => {
      const slide = document.createElement('article');
      slide.className = 'slide' + (i === current ? ' active' : '');
      slide.setAttribute('data-index', i);

      const badgeClass = day.country === 'ch' ? 'badge-ch' : 'badge-fr';
      const badgeText  = day.country === 'ch' ? ui.badgeCh : ui.badgeFr;

      const hotelHTML = day.hotel.query
        ? `<div class="hotel-card">
             <div class="hotel-stars">${day.hotel.stars}</div>
             <div class="hotel-name">${day.hotel.name}</div>
             <div class="hotel-loc">📍 ${day.hotel.loc}</div>
             <p class="book-note" style="margin-bottom:12px;margin-top:0">${ui.hotelSuggestion}</p>
             <a class="book-btn"
                href="https://www.google.com/search?q=${encodeURIComponent(day.hotel.query)}"
                target="_blank" rel="noopener noreferrer">${ui.bookBtn}</a>
             <a class="book-btn" style="margin-top:8px;background:var(--glacier,#4a8fa6)"
                href="https://www.hotels.com/search.do?q=${encodeURIComponent(day.hotel.loc.split('—')[0].trim())}"
                target="_blank" rel="noopener noreferrer">${ui.browseHotels}</a>
           </div>`
        : `<div class="hotel-card">
             <div class="hotel-name">${ui.flightDay}</div>
             <div class="hotel-loc">📍 ${ui.flightLoc}</div>
           </div>`;

      slide.innerHTML = `
        <div class="hero">
          <img class="hero-img" src="${day.image}" alt="${day.imageAlt}" loading="${i <= 1 ? 'eager' : 'lazy'}" />
          <div class="hero-gradient"></div>
        </div>
        <div class="day-header">
          <span class="day-label">${day.label}</span>
          <h1 class="location-title">${day.title}</h1>
          <p class="location-subtitle">${day.subtitle}</p>
          <p class="tagline">${day.tagline}</p>
          <span class="country-badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="day-content">
          <div class="section">
            <div class="section-header">${ui.plan}</div>
            ${day.activities.map(a => `
              <div class="activity-item">
                <span class="act-icon">${a.icon}</span>
                <div><div class="act-name">${a.name}</div><div class="act-desc">${a.desc}</div></div>
              </div>`).join('')}
          </div>
          <div class="section">
            <div class="section-header">${ui.eat}</div>
            ${day.food.map(f => `
              <div class="food-item">
                <span class="food-icon">${f.icon}</span>
                <div><div class="food-name">${f.name}</div><div class="food-desc">${f.desc}</div></div>
              </div>`).join('')}
          </div>
          <div class="section">
            <div class="section-header">${ui.sleep}</div>
            ${hotelHTML}
          </div>
          <div class="section">
            <div class="tips-box">
              <div class="tips-label">${ui.tips}</div>
              ${day.tips.map(t => `
                <div class="tip-row">
                  <span class="tip-icon">${t.icon}</span>
                  <span class="tip-text">${t.text}</span>
                </div>`).join('')}
            </div>
          </div>
        </div>`;
      slider.appendChild(slide);
    });

    slider.style.width = `${days.length * 100}vw`;
  }

  /* ─── BUILD DOTS ────────────────────────────────────────────── */
  function buildDots() {
    const container = document.getElementById('dayDots');
    container.innerHTML = '';
    DAYS[lang].forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === current ? ' active' : '');
      dot.addEventListener('click', () => goTo(i));
      container.appendChild(dot);
    });
  }

  /* ─── UPDATE STATIC UI ──────────────────────────────────────── */
  function updateStaticUI() {
    const ui = UI[lang];
    document.getElementById('tripTitle').innerHTML  = ui.tripTitle;
    document.getElementById('langBtn').textContent  = ui.langBtn;
    document.getElementById('modalTitle').textContent = ui.modalTitle;
    document.getElementById('modalClose').textContent = ui.closeBtn;
    document.getElementById('em1').textContent = ui.em1;
    document.getElementById('em2').textContent = ui.em2;
    document.getElementById('em3').textContent = ui.em3;
    document.getElementById('em4').textContent = ui.em4;
    document.getElementById('em5').textContent = ui.em5;
    document.getElementById('em6').textContent = ui.em6;
    document.getElementById('em7').textContent = ui.em7;
  }

  /* ─── UPDATE DOTS ───────────────────────────────────────────── */
  function updateDots() {
    document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
  }

  /* ─── GO TO SLIDE ───────────────────────────────────────────── */
  function goTo(index, animate = true) {
    const slider = document.getElementById('slider');
    const slides = document.querySelectorAll('.slide');
    if (slides[current]) slides[current].classList.remove('active');
    current = Math.max(0, Math.min(DAYS[lang].length - 1, index));
    if (!animate) slider.classList.add('no-transition');
    slider.style.transform = `translateX(calc(${-current} * 100vw))`;
    if (!animate) requestAnimationFrame(() => requestAnimationFrame(() => slider.classList.remove('no-transition')));
    const newSlides = document.querySelectorAll('.slide');
    if (newSlides[current]) {
      newSlides[current].classList.add('active');
      newSlides[current].scrollTop = 0;
    }
    updateDots();
  }

  /* ─── LANGUAGE TOGGLE ───────────────────────────────────────── */
  function toggleLang() {
    lang = lang === 'en' ? 'es' : 'en';
    buildSlides();
    buildDots();
    updateStaticUI();
    goTo(current, false);
  }

  /* ─── TOUCH / SWIPE ─────────────────────────────────────────── */
  let tx0 = 0, ty0 = 0, swipeDir = null;
  const edgeL = document.getElementById('edgeLeft');
  const edgeR = document.getElementById('edgeRight');

  document.addEventListener('touchstart', e => {
    tx0 = e.touches[0].clientX;
    ty0 = e.touches[0].clientY;
    swipeDir = null;
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - tx0;
    const dy = e.touches[0].clientY - ty0;
    if (!swipeDir) {
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) swipeDir = 'h';
      else if (Math.abs(dy) > 10) swipeDir = 'v';
    }
    if (swipeDir === 'h') {
      e.preventDefault();
      const days = DAYS[lang];
      let resist = 1;
      if ((current === 0 && dx > 0) || (current === days.length - 1 && dx < 0)) resist = 0.18;
      const pct = (dx / window.innerWidth) * 100 * resist;
      const slider = document.getElementById('slider');
      slider.style.transition = 'none';
      slider.style.transform = `translateX(calc(${-current * 100}vw + ${pct}vw))`;
      if (dx < -12) { edgeR.classList.add('show'); edgeL.classList.remove('show'); }
      else if (dx > 12) { edgeL.classList.add('show'); edgeR.classList.remove('show'); }
    }
  }, { passive: false });

  document.addEventListener('touchend', e => {
    edgeL.classList.remove('show');
    edgeR.classList.remove('show');
    if (swipeDir === 'h') {
      const dx = e.changedTouches[0].clientX - tx0;
      const slider = document.getElementById('slider');
      slider.style.transition = 'transform 0.46s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      const days = DAYS[lang];
      if (dx < -55 && current < days.length - 1) goTo(current + 1);
      else if (dx > 55 && current > 0) goTo(current - 1);
      else goTo(current);
    }
    swipeDir = null;
  }, { passive: true });

  /* ─── MODAL ─────────────────────────────────────────────────── */
  document.getElementById('infoBtn').addEventListener('click', () => document.getElementById('modal').classList.add('open'));
  document.getElementById('modalClose').addEventListener('click', () => document.getElementById('modal').classList.remove('open'));
  document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') document.getElementById('modal').classList.remove('open'); });

  /* ─── LANGUAGE BUTTON ───────────────────────────────────────── */
  document.getElementById('langBtn').addEventListener('click', toggleLang);

  /* ─── KEYBOARD NAV ──────────────────────────────────────────── */
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') goTo(current + 1);
    if (e.key === 'ArrowLeft')  goTo(current - 1);
  });

  /* ─── INIT ──────────────────────────────────────────────────── */
  buildSlides();
  buildDots();
  updateStaticUI();
  goTo(0, false);
</script>
